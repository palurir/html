<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101322">
  <title>Hello, World!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; color: #f7f7ff; background: #101322; }
    body::before, body::after { content: ""; position: fixed; width: 38rem; height: 38rem; border-radius: 50%; filter: blur(90px); opacity: .28; pointer-events: none; }
    body::before { background: #7c5cff; top: -19rem; left: -12rem; }
    body::after { background: #00d5c0; bottom: -23rem; right: -12rem; }
    main { position: relative; width: min(90vw, 760px); padding: clamp(2.5rem, 8vw, 5.5rem); text-align: center; border: 1px solid #ffffff20; border-radius: 32px; background: linear-gradient(145deg, #ffffff12, #ffffff05); box-shadow: 0 30px 100px #0008, inset 0 1px #ffffff20; backdrop-filter: blur(18px); animation: arrive .8s cubic-bezier(.2,.8,.2,1) both; }
    .spark { display: inline-grid; place-items: center; width: 58px; height: 58px; margin-bottom: 1.5rem; border: 1px solid #ffffff30; border-radius: 18px; background: linear-gradient(135deg, #a891ff, #58e8db); color: #101322; font-size: 1.65rem; box-shadow: 0 8px 30px #7c5cff55; }
    .eyebrow { margin: 0 0 .8rem; color: #9eece4; font-size: .76rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3.25rem, 11vw, 6.5rem); line-height: .98; letter-spacing: -.075em; }
    h1 span { color: transparent; background: linear-gradient(90deg, #b6a6ff, #74efe0); background-clip: text; }
    p { max-width: 34rem; margin: 1.4rem auto 0; color: #c3c5d4; font-size: clamp(1rem, 2vw, 1.15rem); line-height: 1.7; }
    .rule { width: 54px; height: 3px; margin: 2rem auto 0; border-radius: 9px; background: linear-gradient(90deg, #a891ff, #58e8db); }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <div class="spark" aria-hidden="true">✦</div>
    <p class="eyebrow">A little something to start</p>
    <h1>Hello,<br><span>World!</span></h1>
    <p>Fresh page, bright possibilities. Here’s to making something wonderful, one line at a time.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
